name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data (skip if real dataset is committed)
        run: |
          if [ ! -f data/raw/telco_churn.csv ]; then
            python src/generate_data.py
          fi

      - name: Train model (needed for full API test coverage)
        run: python src/train.py

      - name: Run tests
        run: pytest -v

      - name: Lint
        run: |
          pip install ruff
          ruff check src api app tests
